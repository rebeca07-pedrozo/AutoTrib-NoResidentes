<style>
/* ============================================================
   AutoTrib · sistema visual
   Rojo Davivienda como color de marca y de acción; neutros cálidos para trabajar muchas horas.
   Sin degradados, sin sombras en reposo: la jerarquía viene de tono, tamaño y espacio.
   ============================================================ */
:root{
  --pri:#E41F13; --pri-osc:#B5170D; --pri-tint:#FDECEA;
  --ground:#F5F3F2; --surface:#FFFFFF; --surface-2:#FAF8F7;
  --ink:#231D1C; --ink-2:#5F5654; --ink-3:#7A706D;
  --line:#E4DDD9; --line-2:#CFC6C1;
  --ok:#1B5E20; --ok-bg:#E6F2E7; --warn:#7A4B00; --warn-bg:#FFF1D0; --bad:#B3261E; --bad-bg:#FCE8E6;
  --info:#0B4A8F; --info-bg:#E7EFF9; --neutral:#4A4442; --neutral-bg:#EBE6E3;
  --r:10px; --r-lg:14px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --f-body:Arial,Helvetica,sans-serif; --f-num:"Courier New",Courier,monospace;
  --azul:#003D82; --azul-cl:#E7EFF9;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:84px;scroll-padding-bottom:24px;scrollbar-color:var(--line-2) var(--ground)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.5;color:var(--ink);background:var(--ground);min-height:100vh;caret-color:var(--pri)}
::selection{background:var(--pri);color:#fff}
h1,h2,h3{margin:0;color:var(--ink);font-weight:700;text-wrap:balance}
h1{font-size:clamp(24px,3.4vw,30px);line-height:1.15;letter-spacing:-.01em}
h2{font-size:20px;line-height:1.2} h3{font-size:16px;line-height:1.3}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input[type=checkbox],input[type=radio]{accent-color:var(--pri)}
.oculto{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.num,.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* Foco visible para teclado, en todo el sistema */
:focus{outline:none}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px;border-radius:6px}
.cab :focus-visible,.hero :focus-visible,.splash :focus-visible,.calc :focus-visible{outline-color:#fff}
.skip{position:absolute;left:12px;top:-60px;background:#fff;color:var(--pri-osc);font-weight:700;padding:10px 14px;border-radius:8px;z-index:100;text-decoration:none;transition:top .15s var(--ease)}
.skip:focus{top:10px}

/* ---------- Cabecera ---------- */
.cab{background:var(--pri);color:#fff;position:sticky;top:0;z-index:20;overflow:hidden}
.cab-in{position:relative;max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-height:60px}
.logo{display:flex;flex-direction:column;line-height:1.1;cursor:pointer;user-select:none;background:0;border:0;color:#fff;padding:0;text-align:left}
.logo small{font-weight:400;font-size:12px;opacity:.92;margin-top:3px}
.wm{font-weight:700;font-size:24px;letter-spacing:-.01em;text-transform:lowercase}
.wm.grande{font-size:48px}
.logo-img{height:34px;max-width:200px;object-fit:contain;object-position:left}
.logo-img.grande{height:84px;max-width:80vw;object-position:center}
.nav{display:flex;gap:2px;flex-wrap:wrap;margin-left:auto}
.nav button{background:transparent;color:#fff;border:0;padding:10px 13px;border-radius:8px;cursor:pointer;font-size:14px;min-height:44px;transition:background-color .15s var(--ease),color .15s var(--ease)}
.nav button:hover{background:rgba(255,255,255,.16)}
.nav button[aria-current=page]{background:#fff;color:var(--pri-osc);font-weight:700}
.usuario{font-size:12.5px;text-align:right;line-height:1.35;opacity:.95}
main{max-width:1120px;margin:0 auto;padding:28px 20px 64px}
.vista{animation:ent .3s var(--ease)}
@keyframes ent{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pie{text-align:center;font-size:12.5px;color:var(--ink-3);padding:20px}

/* ---------- Decoración: imagen de Drive o triángulos CSS por defecto ---------- */
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.deco::before,.deco::after{content:"";position:absolute;background:rgba(255,255,255,.10);clip-path:polygon(0 100%,100% 100%,100% 0)}
.deco::before{width:260px;height:260px;right:-20px;bottom:-30px}
.deco::after{width:150px;height:150px;right:200px;bottom:-20px;background:rgba(255,255,255,.07)}
html.img-tri .deco::before,html.img-tri .deco::after{display:none}
html.img-tri .deco{background:var(--img-triangulos) right center/auto 100% no-repeat}
.cab .deco::before{width:120px;height:120px;bottom:-60px} .cab .deco::after{width:70px;height:70px;right:140px;bottom:-35px}

/* ---------- Encabezado de página ---------- */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h p{color:var(--ink-2);margin-top:6px;max-width:62ch}

/* ---------- Superficies ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px;margin-bottom:16px}
.card>h3,.card>.card-h{margin-bottom:16px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.card-h h3{margin:0}.hint{color:var(--ink-2);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px}

/* Cifras de resumen: una sola superficie, no tres tarjetas iguales */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin:16px 0 20px;overflow:hidden}
.stat{padding:16px 22px;border-right:1px solid var(--line)} .stat:last-child{border-right:0}
.stat .n{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat .t{font-size:13px;color:var(--ink-2);margin-top:2px}
.stat.alerta .n{color:var(--pri)}

/* Bienvenida */
.hero{background:var(--pri);color:#fff;border-radius:var(--r-lg);padding:30px;position:relative;overflow:hidden}
html.img-bienv .hero{background:var(--pri) var(--img-bienvenida) center/cover no-repeat}
html.img-bienv .hero::before{content:"";position:absolute;inset:0;background:rgba(196,22,12,.84)}
.hero>*{position:relative} .hero>.deco{position:absolute}
.hero h1{color:#fff;font-size:clamp(26px,4vw,36px)} .hero p{margin-top:8px;opacity:.96}
.pasos{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:8px;max-width:520px}
.pasos li{background:rgba(255,255,255,.14);padding:10px 14px;border-radius:8px}
.acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

/* ---------- Botones ---------- */
.btn{border:2px solid var(--pri);border-radius:var(--r);padding:0 20px;min-height:44px;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;background:var(--pri);color:#fff;
  transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),transform .15s var(--ease)}
.btn:hover:not(:disabled){background:var(--pri-osc);border-color:var(--pri-osc)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{background:#D9D2CE;border-color:#D9D2CE;color:#7A706D;cursor:not-allowed}
.btn.rojo{background:var(--pri-osc);border-color:var(--pri-osc)} .btn.rojo:hover:not(:disabled){background:#8F1209;border-color:#8F1209}
.btn.verde{background:var(--ok);border-color:var(--ok)} .btn.verde:hover:not(:disabled){background:#134517;border-color:#134517}
.btn.sec{background:transparent;color:var(--pri-osc);border-color:var(--pri)} .btn.sec:hover:not(:disabled){background:var(--pri-tint);border-color:var(--pri);color:var(--pri-osc)}
.btn.blanco{background:#fff;color:var(--pri-osc);border-color:#fff} .btn.blanco:hover:not(:disabled){background:var(--pri-tint);border-color:var(--pri-tint)}
.btn.peq{min-height:38px;padding:0 14px;font-size:13px}
.link-btn{background:0;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color .15s var(--ease)}
.link-btn:hover{text-decoration-color:currentColor}
.barra{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* ---------- Formularios ---------- */
label,.lbl{display:block;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
.campo{margin-bottom:16px}
.campo input,.campo select,.campo textarea{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line-2);border-radius:var(--r);background:#fff;font-size:15px;
  transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.campo textarea{resize:vertical;min-height:84px}
.campo input:hover,.campo select:hover,.campo textarea:hover{border-color:#B8ADA8}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-tint)}
.campo input:focus-visible,.campo select:focus-visible,.campo textarea:focus-visible{outline:0}
.campo input::placeholder,.campo textarea::placeholder{color:var(--ink-3)}
.campo input[readonly]{background:var(--surface-2);color:var(--ink-2)}
.campo input:disabled{background:var(--surface-2);color:var(--ink-3);border-style:dashed;cursor:not-allowed}
.campo .msg{font-size:13px;min-height:18px;margin-top:5px;color:var(--ink-2)}
.campo.ok input,.campo.ok select,.campo.ok textarea{border-color:var(--ok)} .campo.ok .msg{color:var(--ok)}
.campo.warn input,.campo.warn select,.campo.warn textarea{border-color:#C98A00} .campo.warn .msg{color:var(--warn)}
.campo.bad input,.campo.bad select,.campo.bad textarea{border-color:var(--bad);background:#FFFBFA} .campo.bad .msg{color:var(--bad)}
.pref{position:relative} .pref span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-2);font-family:var(--f-num);pointer-events:none}
.pref input{padding-left:30px;font-family:var(--f-num);font-size:16px}
.cdt-num input{font-family:var(--f-num);font-size:20px;font-weight:700;letter-spacing:.02em;min-height:54px}

/* Control segmentado Activo / Cancelado */
fieldset.campo{border:0;padding:0;margin:0 0 16px;min-width:0}
fieldset.campo legend{padding:0;font-size:13.5px;font-weight:700;margin-bottom:6px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:#fff}
.seg input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.seg label{margin:0;min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-weight:700;color:var(--ink-2);
  transition:background-color .15s var(--ease),color .15s var(--ease)}
.seg label+input+label,.seg input+label+input+label{border-left:1.5px solid var(--line-2)}
.seg label::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid currentColor}
.seg input:checked+label{color:#fff}
.seg input[value=Activo]:checked+label{background:var(--ok)} .seg input[value=Cancelado]:checked+label{background:var(--neutral)}
.seg input:checked+label::before{background:#fff;border-color:#fff}
.seg input:focus-visible+label{outline:3px solid var(--pri);outline-offset:-3px}
.seg label:hover{background:var(--surface-2)} .seg input:checked+label:hover{filter:brightness(1.08)}

/* Opciones grandes (qué desea el cliente) */
.opciones{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative}
.opciones input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.opciones label{margin:0;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1.5px solid var(--line-2);border-radius:var(--r);background:#fff;cursor:pointer;
  transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.opciones label b{font-size:16px} .opciones label span{font-weight:400;font-size:13.5px;color:var(--ink-2);line-height:1.4}
.opciones label:hover{border-color:#B8ADA8}
.opciones input:checked+label{border-color:var(--pri);background:var(--pri-tint);box-shadow:inset 0 0 0 1px var(--pri)}
.opciones input:checked+label b{color:var(--pri-osc)}
.opciones input:focus-visible+label{outline:3px solid var(--pri);outline-offset:2px}

/* Autocompletar */
.ac{position:relative}
.ac-lista{position:absolute;left:0;right:0;top:100%;margin-top:3px;z-index:30;background:#fff;border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 8px 24px rgba(35,29,28,.14);max-height:260px;overflow:auto}
.ac-item{padding:11px 13px;cursor:pointer} .ac-item.act,.ac-item:hover{background:var(--pri-tint);color:var(--pri-osc)}

/* Formulario en dos columnas: datos a la izquierda, cálculo siempre a la vista a la derecha */
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0 24px;align-items:start}
.form-grid>.f-sec{grid-column:1}
.form-grid>.f-calc{grid-column:2;grid-row:1 / span 8;position:sticky;top:84px;align-self:start}
.f-calc .calc{margin-bottom:0}

/* ---------- Cálculo ---------- */
.calc{background:var(--pri);color:#fff;border-radius:var(--r-lg);padding:20px 22px;margin-bottom:16px}
.calc h3{color:#fff;margin-bottom:6px}
.calc .fila{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.28)}
.calc .fila:last-child{border:0}
.calc .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;white-space:nowrap}
.calc .fila.total .v{font-size:24px}
.calc .nota{display:block;font-size:12px;opacity:.9;font-weight:400}
.calc.claro{background:var(--pri-tint);color:var(--ink);border:1px solid #F3C4C0}
.calc.claro h3{color:var(--pri-osc)} .calc.claro .fila{border-color:#F3C4C0} .calc.claro .fila.total .v{color:var(--pri-osc)}

/* ---------- Validación y avisos ---------- */
.chk{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 16px;font-size:13.5px}
.chk li{display:flex;gap:7px;color:var(--ink-2)} .chk li.ok{color:var(--ok)} .chk li.bad{color:var(--bad)} .chk li.warn{color:var(--warn)}
.banner{padding:12px 16px;border-radius:var(--r);font-weight:700;margin:14px 0 0}
.banner.ok{background:var(--ok-bg);color:var(--ok)} .banner.no{background:var(--warn-bg);color:var(--warn)} .banner.err{background:var(--bad-bg);color:var(--bad)}
.banner.info{background:var(--info-bg);color:var(--info)}
.aviso-espera{font-weight:400;line-height:1.5} .aviso-espera b{font-weight:700}
.aviso-espera.centrado{max-width:60ch;margin:16px auto 0;text-align:left}

/* ---------- Tablas ---------- */
.tabla-w{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{background:var(--surface-2);color:var(--ink-2);text-align:left;padding:12px 14px;font-size:13px;font-weight:700;white-space:nowrap;border-bottom:2px solid var(--pri)}
.t td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr:nth-child(even){background:#FCFAF9}
.t tbody tr.clic{cursor:pointer;transition:background-color .15s var(--ease)}
.t tbody tr.clic:hover{background:var(--pri-tint)}
.t tbody tr.cancelado td{color:var(--ink-2)}
.t td.m,.t th.m{text-align:right;font-variant-numeric:tabular-nums}
.t td.m{font-family:var(--f-num)}
.t td.sel-c{width:44px;padding-right:0}
.cdt-celda{display:flex;flex-direction:column;gap:2px;min-width:132px}
.cdt-celda .n{font-family:var(--f-num);font-weight:700;font-size:15px;color:var(--ink)}
.cdt-celda .n.sin{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--warn);font-style:italic}
.cdt-celda .s{font-size:12.5px;color:var(--ink-3)}
.vacio{text-align:center;padding:40px 16px;color:var(--ink-2)}
.vacio strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* Etiquetas de estado: punto + texto (el color nunca es la única señal) */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.Pendiente,.chip.Enviada{background:var(--warn-bg);color:var(--warn)}
.chip.Aprobado,.chip.Confirmada,.chip.Activo{background:var(--ok-bg);color:var(--ok)}
.chip.Pagado,.chip.Modificada{background:var(--info-bg);color:var(--info)}
.chip.Rechazado{background:var(--bad-bg);color:var(--bad)}
.chip.Cancelado,.chip.Cancelada{background:var(--neutral-bg);color:var(--neutral)}
.chip.Cancelado::before{border-radius:2px}

/* Filtros */
.filtros{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filtros .campo{margin:0;min-width:140px;flex:1}
.filtros .campo.busq{flex:2;min-width:220px}
.neg{color:var(--bad)} .pos{color:var(--ok)}

/* ---------- Modal ---------- */
.velo{position:fixed;inset:0;background:rgba(35,29,28,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;animation:ent .2s var(--ease)}
.modal{background:#fff;border-radius:var(--r-lg);max-width:760px;width:100%;box-shadow:0 16px 48px rgba(0,0,0,.28);overflow:hidden}
.modal.peq{max-width:440px;margin-top:12vh}
.modal-h{padding:18px 22px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.modal-h h2{font-size:20px} .modal-h .sub{color:var(--ink-2);font-size:13px;margin-top:2px}
.modal-h .x{background:0;border:0;color:var(--ink-2);font-size:28px;line-height:1;cursor:pointer;min-width:44px;min-height:44px;border-radius:8px;margin:-8px -10px 0 0}
.modal-h .x:hover{background:var(--surface-2);color:var(--ink)}
.cdt-titulo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cdt-titulo .n{font-family:var(--f-num);font-size:26px;font-weight:700;letter-spacing:.01em}
.cdt-titulo .n.sin{font-family:var(--f-body);font-size:18px;font-weight:400;font-style:italic;color:var(--warn)}
.modal-b{padding:20px 22px} .modal-b h3{margin:20px 0 8px;font-size:15px} .modal-b h3:first-child{margin-top:0}
.modal-p{padding:14px 22px;background:var(--surface-2);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dato{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);gap:16px} .dato span{color:var(--ink-2)} .dato b{text-align:right;font-weight:700}
.bloque-cdt{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 4px;margin-top:6px}
.aud{list-style:none;padding:0;margin:0;font-size:13px;color:var(--ink-2)} .aud li{padding:7px 0;border-bottom:1px solid var(--line)} .aud li:last-child{border:0}

/* ---------- Pasos de pago ---------- */
.paso{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 22px;margin-bottom:12px}
.paso.hecho{border-color:var(--ok);background:#F8FCF8}
.paso h3{margin-bottom:8px}
.paso label.ck{display:flex;gap:12px;align-items:flex-start;font-size:15px;font-weight:400;color:var(--ink);padding:8px 0;cursor:pointer;min-height:44px;margin:0}
.paso input[type=checkbox]{width:22px;height:22px;margin-top:0;flex:none}

/* ---------- Carga, toast, acceso denegado ---------- */
.splash{min-height:100vh;display:grid;place-items:center;background:var(--pri-osc) var(--bg,none) center/cover no-repeat;color:#fff;text-align:center;padding:20px;position:relative;overflow:hidden}
.splash::before{content:"";position:absolute;inset:0;background:var(--pri);opacity:.9}
.splash h1{color:#fff;font-size:28px;margin:10px 0 4px} .splash-in{position:relative;z-index:1}
.spin{display:inline-block;width:42px;height:42px;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:giro .8s linear infinite;margin:18px 0 8px}
.spin.az{border-color:var(--pri-tint);border-top-color:var(--pri);width:28px;height:28px;border-width:4px;margin:0}
@keyframes giro{to{transform:rotate(360deg)}}
.cargando{text-align:center;padding:48px;color:var(--ink-2);display:grid;gap:12px;justify-items:center}
